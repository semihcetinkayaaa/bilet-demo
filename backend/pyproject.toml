[project]
name = "bilet-api"
version = "0.1.0"
description = "Bilet satış sitesi için FastAPI backend"
readme = "README.md"
authors = [
    { name = "Semih Çetinkaya", email = "semihcetinkayaaa@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
