# Loki (log deposu) + Alloy (log toplayıcı)
#
# Coolify'da: Projeye "+ New" > "Docker Compose Empty" > bu dosyanın içeriğini yapıştır.
# Ayarlarda "Connect To Predefined Network" açık olmalı (Grafana Loki'ye 'coolify' ağı üzerinden ulaşır).
# Dışarıya port ya da alan adı AÇILMAZ: Loki'de kimlik doğrulama yok, sadece iç ağdan erişilir.
#
# Alloy, sunucudaki TÜM Docker container'larının loglarını toplar
# (site, backend, veritabanı, n8n, Grafana...). Bunun için Docker soketini
# SALT OKUNUR olarak bağlar.

services:
  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/config.yaml
    configs:
      - source: loki_config
        target: /etc/loki/config.yaml
    volumes:
      - loki-data:/loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  alloy:
    image: grafana/alloy:v1.9.0
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
  alloy-data:

configs:
  loki_config:
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100
        grpc_listen_port: 9096
        log_level: warn

      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules

      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      limits_config:
        retention_period: 720h          # 30 gün
        ingestion_rate_mb: 8
        ingestion_burst_size_mb: 16
        max_query_series: 5000
        allow_structured_metadata: true
        volume_enabled: true

      compactor:
        working_directory: /loki/compactor
        retention_enabled: true
        delete_request_store: filesystem

      analytics:
        reporting_enabled: false

  alloy_config:
    content: |
      // Docker'daki container'ları bul
      discovery.docker "containers" {
        host             = "unix:///var/run/docker.sock"
        refresh_interval = "15s"
      }

      // Etiketler: container adı, Coolify'daki uygulama adı, stdout/stderr
      discovery.relabel "containers" {
        targets = []

        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/(.*)"
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_docker_container_label_coolify_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
          target_label  = "service"
        }
        rule {
          source_labels = ["__meta_docker_container_log_stream"]
          target_label  = "stream"
        }
      }

      loki.source.docker "containers" {
        host             = "unix:///var/run/docker.sock"
        targets          = discovery.docker.containers.targets
        relabel_rules    = discovery.relabel.containers.rules
        refresh_interval = "15s"
        forward_to       = [loki.process.levels.receiver]
      }

      // JSON log satırlarından (ör. backend) 'level' alanını etikete çevir
      loki.process "levels" {
        stage.json {
          expressions = { level = "level" }
        }
        stage.labels {
          values = { level = "" }
        }
        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }
